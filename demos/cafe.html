<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMO</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f5f0;color:#20201d;font-family:system-ui,Arial}header{display:flex;justify-content:space-between;align-items:center;padding:22px 5%;border-bottom:1px solid #ddd}header a,nav a{color:inherit;text-decoration:none}nav{display:flex;gap:20px}main{max-width:1100px;margin:auto;padding:20px}.hero{border-radius:25px;background:linear-gradient(90deg,#181512ed,#18151266),url('../IMG_4818.jpeg') center/cover;color:white;min-height:400px;padding:60px 7%;display:flex;flex-direction:column;justify-content:center;margin:30px 0}h1{font-size:clamp(40px,7vw,76px);margin:10px 0}h2{font-size:32px}p{line-height:1.9;color:#777}.hero p{color:#ddd;max-width:550px}.hero h1{max-width:600px}.hero .btn{background:#c8744b}.item{box-shadow:0 8px 25px #0000000a}.btn,button{display:inline-block;background:#b77d56;color:white;border:0;border-radius:9px;padding:14px 24px;font:inherit;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{border:1px solid #ddd;background:white;border-radius:17px;padding:25px;overflow:hidden}.item:before{content:'';display:block;height:150px;margin:-25px -25px 20px;background:url('../IMG_4818.jpeg') center/cover;border-radius:17px 17px 0 0}.item:nth-child(1):before{background-image:url('https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=850&q=85')}.item:nth-child(2):before{background-image:url('https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=850&q=85')}.item:nth-child(3):before{background-image:url('https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=850&q=85')}.item strong{font-size:21px}.price{color:#a36943;font-weight:bold}.label{color:#b77d56}section{padding:45px 0}footer{background:#222;color:white;text-align:center;padding:35px;margin-top:45px}input,textarea{width:100%;padding:14px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:7px 0}a:focus-visible,button:focus-visible{outline:3px solid #b77d56;outline-offset:3px}@media(max-width:680px){.grid{grid-template-columns:1fr}nav{gap:8px;font-size:12px}.hero{min-height:340px;padding:35px 7%}}.demo-cta{display:inline-block;padding:12px 20px;background:#d16a3b;color:white!important;text-decoration:none;border-radius:10px;font-weight:700;margin:15px auto}.demo-cta:focus-visible{outline:3px solid #d16a3b;outline-offset:3px} .cafe-about-photo{height:220px;border-radius:18px;background:url('../IMG_4818.jpeg') center/cover;margin-bottom:24px}header{background:#171514;color:white;border-color:#352820}header strong{font-family:Georgia,serif;font-size:28px;letter-spacing:.08em}header nav a{color:#f5e8de}.hero{min-height:470px;background:linear-gradient(270deg,#17120fe8 0%,#17120fa6 48%,#17120f1f 100%),url('../IMG_4818.jpeg') center/cover;align-items:flex-start}.hero h1{font-family:Georgia,system-ui;font-size:clamp(40px,7vw,70px);max-width:650px}.hero small{color:#f0a078;letter-spacing:.12em}.hero .btn{align-self:flex-start}.item{padding:18px;box-shadow:0 10px 25px #1e120d13}.item:before{margin:-18px -18px 20px;height:205px}.item strong{display:block}.item .price{font-size:20px}.label{letter-spacing:.1em}#about{display:grid;grid-template-columns:1fr 1fr;column-gap:35px;align-items:center}#about .cafe-about-photo{grid-row:1/4;height:320px;margin:0}#about p{max-width:520px}@media(max-width:680px){header{flex-wrap:wrap;gap:14px}header nav{width:100%;justify-content:space-between}.hero{min-height:390px;padding:45px 7%;background-position:center}.hero h1{font-size:clamp(36px,10vw,52px)}#about{display:block}#about .cafe-about-photo{height:220px;margin-bottom:22px}.item:before{height:220px}}</style></head><body><header><strong id="brand"></strong><nav><a href="#offer">الخدمات</a><a href="#about">من نحن</a><a href="#contact">تواصل</a></nav></header><main><div class="hero"><small id="eyebrow"></small><h1 id="heading"></h1><p id="lead"></p><div><a class="btn" href="#offer">اكتشف المزيد ↓</a></div></div><section id="offer"><span class="label">OUR OFFERINGS</span><h2 id="offerTitle"></h2><div class="grid" id="items"></div></section><section id="about"><div class="cafe-about-photo" role="img" aria-label="جلسة كافيه دافئة"></div><span class="label">OUR STORY</span><h2 id="aboutTitle"></h2><p id="aboutText"></p></section><section id="contact"><span class="label">CONTACT</span><h2>تواصل معنا</h2><p>هذه معاينة توضيحية، وليست خدمة حجز أو طلب فعلية. يمكنك تجربة تجهيز رسالة فقط.</p><form id="form"><input name="name" placeholder="الاسم" required maxlength="100"><textarea name="message" placeholder="اكتب استفسارك" required maxlength="1000"></textarea><button>جهز الرسالة</button><p id="result" aria-live="polite"></p></form></section></main><footer>DEMO BY CRAFTNIVO · <a href="../index.html" style="color:white">العودة إلى CRAFTNIVO</a> · <a href="../index.html?template=cafe#request" class="demo-cta">اطلب موقع مشابه من CRAFTNIVO ↗</a></footer><script>const DATA={"brand":"NOMA CAFÉ","eyebrow":"SPECIALTY COFFEE · FRESH EVERY DAY","heading":"قهوة تستاهل وقتك.","lead":"نكهات متوازنة، جلسات هادئة، وتفاصيل صغيرة تصنع يومك.","offerTitle":"من قائمتنا","items":[["لاتيه","إسبريسو وحليب مخملي","22 د.إ"],["آيس سبانيش","قهوة باردة بطابع غني","26 د.إ"],["كرواسون","مخبوز طازج بطبقات هشة","18 د.إ"]],"aboutTitle":"مساحة لقهوة أفضل","aboutText":"نموذج تصميم لمقهى يعرض القائمة والأسعار والتعريف بالمكان. يمكن تخصيصه لعلامة العميل وصوره ومحتواه."};document.title=DATA.brand+' — Demo by CRAFTNIVO';for(const [id,value] of Object.entries({brand:DATA.brand,eyebrow:DATA.eyebrow,heading:DATA.heading,lead:DATA.lead,offerTitle:DATA.offerTitle,aboutTitle:DATA.aboutTitle,aboutText:DATA.aboutText}))document.getElementById(id).textContent=value;for(const item of DATA.items){const el=document.createElement('article');el.className='item';const h=document.createElement('strong');h.textContent=item[0];const p=document.createElement('p');p.textContent=item[1];const price=document.createElement('p');price.className='price';price.textContent=item[2];el.append(h,p,price);document.getElementById('items').append(el)}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const msg=DATA.brand+' — '+f.get('name')+'\n'+f.get('message');document.getElementById('result').textContent='رسالتك جاهزة (تجريبي): '+msg})</script></body></html>
