<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMO</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f5f0;color:#20201d;font-family:system-ui,Arial}header{display:flex;justify-content:space-between;align-items:center;padding:22px 5%;border-bottom:1px solid #ddd}header a,nav a{color:inherit;text-decoration:none}nav{display:flex;gap:20px}main{max-width:1100px;margin:auto;padding:20px}.hero{border-radius:25px;background:#242522;color:white;min-height:400px;padding:60px 7%;display:flex;flex-direction:column;justify-content:center;margin:30px 0}h1{font-size:clamp(40px,7vw,76px);margin:10px 0}h2{font-size:32px}p{line-height:1.9;color:#777}.hero p{color:#ddd;max-width:550px}.btn,button{display:inline-block;background:#b77d56;color:white;border:0;border-radius:9px;padding:14px 24px;font:inherit;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{border:1px solid #ddd;background:white;border-radius:17px;padding:25px}.item strong{font-size:21px}.price{color:#a36943;font-weight:bold}.label{color:#b77d56}section{padding:45px 0}footer{background:#222;color:white;text-align:center;padding:35px;margin-top:45px}input,textarea{width:100%;padding:14px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:7px 0}a:focus-visible,button:focus-visible{outline:3px solid #b77d56;outline-offset:3px}@media(max-width:680px){.grid{grid-template-columns:1fr}nav{gap:8px;font-size:12px}.hero{min-height:340px;padding:35px 7%}}.demo-cta{display:inline-block;padding:12px 20px;background:#d16a3b;color:white!important;text-decoration:none;border-radius:10px;font-weight:700;margin:15px auto}.demo-cta:focus-visible{outline:3px solid #d16a3b;outline-offset:3px}</style></head><body><header><strong id="brand"></strong><nav><a href="#offer">الخدمات</a><a href="#about">من نحن</a><a href="#contact">تواصل</a></nav></header><main><div class="hero"><small id="eyebrow"></small><h1 id="heading"></h1><p id="lead"></p><div><a class="btn" href="#offer">اكتشف المزيد ↓</a></div></div><section id="offer"><span class="label">OUR OFFERINGS</span><h2 id="offerTitle"></h2><div class="grid" id="items"></div></section><section id="about"><span class="label">OUR STORY</span><h2 id="aboutTitle"></h2><p id="aboutText"></p></section><section id="contact"><span class="label">CONTACT</span><h2>تواصل معنا</h2><p>هذه معاينة توضيحية، وليست خدمة حجز أو طلب فعلية. يمكنك تجربة تجهيز رسالة فقط.</p><form id="form"><input name="name" placeholder="الاسم" required maxlength="100"><textarea name="message" placeholder="اكتب استفسارك" required maxlength="1000"></textarea><button>جهز الرسالة</button><p id="result" aria-live="polite"></p></form></section></main><footer>DEMO BY CRAFTNIVO · <a href="../index.html" style="color:white">العودة إلى CRAFTNIVO</a> · <a href="../index.html?template=cafe#request" class="demo-cta">اطلب موقع مشابه من CRAFTNIVO ↗</a></footer><script>const DATA={"brand":"NOMA CAFÉ","eyebrow":"SPECIALTY COFFEE · FRESH EVERY DAY","heading":"قهوة تستاهل وقتك.","lead":"نكهات متوازنة، جلسات هادئة، وتفاصيل صغيرة تصنع يومك.","offerTitle":"من قائمتنا","items":[["لاتيه","إسبريسو وحليب مخملي","22 د.إ"],["آيس سبانيش","قهوة باردة بطابع غني","26 د.إ"],["كرواسون","مخبوز طازج بطبقات هشة","18 د.إ"]],"aboutTitle":"مساحة لقهوة أفضل","aboutText":"نموذج تصميم لمقهى يعرض القائمة والأسعار والتعريف بالمكان. يمكن تخصيصه لعلامة العميل وصوره ومحتواه."};document.title=DATA.brand+' — Demo by CRAFTNIVO';for(const [id,value] of Object.entries({brand:DATA.brand,eyebrow:DATA.eyebrow,heading:DATA.heading,lead:DATA.lead,offerTitle:DATA.offerTitle,aboutTitle:DATA.aboutTitle,aboutText:DATA.aboutText}))document.getElementById(id).textContent=value;for(const item of DATA.items){const el=document.createElement('article');el.className='item';const h=document.createElement('strong');h.textContent=item[0];const p=document.createElement('p');p.textContent=item[1];const price=document.createElement('p');price.className='price';price.textContent=item[2];el.append(h,p,price);document.getElementById('items').append(el)}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const msg=DATA.brand+' — '+f.get('name')+'\n'+f.get('message');document.getElementById('result').textContent='رسالتك جاهزة (تجريبي): '+msg})</script></body></html>
