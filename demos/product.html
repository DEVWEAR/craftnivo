<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج — ATELIER</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f8f5ef;color:#29221d}header{display:flex;justify-content:space-between;align-items:center;padding:22px 5%;border-bottom:1px solid #ddd}a{color:inherit}main{max-width:1100px;margin:50px auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:45px}img{width:100%;aspect-ratio:4/5;object-fit:contain;border-radius:12px;background:#eee9e3}h1{font-size:clamp(30px,5vw,52px)}p{color:#655c53;line-height:1.9}button{background:#29221d;color:white;border:0;border-radius:5px;padding:14px 25px;font:inherit;cursor:pointer}.price{font-size:27px;color:#29221d;font-weight:bold}select,input{padding:12px;border:1px solid #ccc;border-radius:5px;background:white;margin:8px 0;max-width:130px}.options{display:flex;gap:12px;flex-wrap:wrap}footer{text-align:center;padding:25px;background:#29221d;color:white}@media(max-width:700px){main{grid-template-columns:1fr;margin:15px auto;gap:15px}img{aspect-ratio:4/3}}</style></head><body><header><strong>ATELIER</strong><a href="store.html">← العودة للمتجر</a></header><main><img id="photo" alt="صورة المنتج"><section><p>ATELIER COLLECTION</p><h1 id="name"></h1><p id="desc"></p><p class="price" id="price"></p><div class="options"><select id="size" aria-label="المقاس"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select><select id="color" aria-label="اللون"><option>أسود</option><option>أبيض</option><option>بيج</option></select><input id="qty" aria-label="الكمية" type="number" value="1" min="1" max="10"></div><button onclick="preview()">أضف للسلة التجريبية</button><p id="status" aria-live="polite"></p><p>هذا نموذج عرض تجريبي من CRAFTNIVO. المنتجات والأسعار توضيحية، ولا توجد عمليات دفع أو طلبات حقيقية.</p></section></main><footer>ATELIER — DEMO BY CRAFTNIVO</footer><script>const items=[['تيشيرت كلاسيكي','قطن مريح بقصة عصرية. قطعة أساسية للإطلالات اليومية.',75,'photo-1521572163474-6864f9cf17ab'],['جاكيت يومي','تصميم عملي وأنيق للأجواء المعتدلة.',189,'https://no-excess.com/cdn/shop/files/30621122_020_5.jpg?v=1760959287&width=1125'],['حقيبة كاجوال','حقيبة عملية بتفاصيل بسيطة تناسب يومك.',120,'https://www.osgoodemarley.com/cdn/shop/products/Med_Crossbody_Black_Front-027.jpg?v=1669051508']];let id=Number(new URLSearchParams(location.search).get('id'));if(!Number.isInteger(id)||id<0||id>=items.length)id=0;const x=items[id];document.getElementById('name').textContent=x[0];document.getElementById('desc').textContent=x[1];document.getElementById('price').textContent=x[2]+' د.إ';document.getElementById('photo').src=x[3].startsWith('https://')?x[3]:'https://images.unsplash.com/'+x[3]+'?w=1100&q=85';document.getElementById('photo').alt=x[0];if(id===2)document.getElementById('size').remove();function preview(){const q=Math.max(1,Math.min(10,Number(document.getElementById('qty').value)||1));document.getElementById('status').textContent='تم اختيار '+q+' × '+x[0]+' — '+q*x[2]+' د.إ. هذه معاينة فقط، ولم تتم إضافة المنتج لسلة المتجر الرئيسية.'}</script></body></html>
